<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Loan System</title>

  <!-- PWA Manifest & Android Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a56db">

  <!-- iOS Safari Standalone App Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Loan System">
  <link rel="apple-touch-icon" href="icon-512.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #f0f4f8;
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    }

    .loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a3faa 0%, #1a56db 60%, #2563eb 100%);
      color: #ffffff;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.25);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    iframe {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="loader" id="appLoader">
    <div class="spinner"></div>
    <div style="font-size: 0.95rem; font-weight: 700; letter-spacing: 0.2px;">Loading Loan System...</div>
  </div>

  <iframe
    id="gasFrame"
    src="https://script.google.com/macros/s/AKfycbydIgzCbiTL0ZVqmVoij9nl1jHYAtciIzSXVR_BxG4fD5lZxzd2m_O74Lml72fHuRheSw/exec"
    allow="geolocation; camera; microphone; fullscreen"
    onload="document.getElementById('appLoader').classList.add('hidden')">
  </iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch((err) => console.error('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
